name: shea

services:
  uploads-init:
    image: alpine:3.20
    container_name: shea-uploads-init
    command:
      - sh
      - -c
      - |
        mkdir -p /app/uploads/products /app/uploads/brands /app/uploads/logos /app/uploads/favicons
        chown -R 1001:1001 /app/uploads
    volumes:
      - ./backend/uploads:/app/uploads
    restart: "no"
    networks:
      - shea-network
  
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shea-backend
    restart: unless-stopped
    depends_on:
      uploads-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-shea}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shea}?schema=public
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://${SHEA_DOMAIN}}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-/app/secrets/firebase-service-account.json}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_USER_NAME: ${EMAIL_USER_NAME:-Shea}
    volumes:
      - backend_logs:/app/logs
      - ./backend/uploads:/app/uploads
      - ./secrets/firebase-service-account.json:/app/secrets/firebase-service-account.json:ro
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      shea-network:
        aliases:
          - backend

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: shea-admin
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      INTERNAL_API_URL: http://backend:3001
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      shea-network:
        aliases:
          - admin

  caddy:
    image: caddy:2-alpine
    container_name: shea-caddy
    restart: unless-stopped
    depends_on:
      admin:
        condition: service_healthy
      backend:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./backend/uploads:/srv/uploads:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - shea-network

volumes:
  backend_logs:
  caddy_data:
  caddy_config:

networks:
  shea-network:
    driver: bridge
