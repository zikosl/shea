name: shea-cloud-gateway

services:
  cloud-gateway:
    build:
      context: ../..
      dockerfile: gateways/cloud-gateway/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "${CLOUD_GATEWAY_BIND_ADDRESS:-127.0.0.1}:3520:3520"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3520/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
