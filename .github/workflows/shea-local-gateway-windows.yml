name: Shea Local Gateway Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "local-gateway-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/pos-protocol/package-lock.json
            gateways/local-gateway/package-lock.json
      - name: Build shared protocol
        working-directory: packages/pos-protocol
        run: npm ci && npm run build
      - name: Build Windows installer
        working-directory: gateways/local-gateway
        run: npm ci && npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: shea-local-gateway-windows
          path: gateways/local-gateway/installer/output/*.exe
          if-no-files-found: error
